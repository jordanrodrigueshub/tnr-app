<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TnR App</title>
    <style>
      body { font-family: Inter, system-ui, Arial; margin:0; }
      .top { display:flex; gap:16px; align-items:center; padding:16px 24px; border-bottom:1px solid #eee; }
      .nav a { margin-right: 16px; text-decoration:none; color:#333 }
      .nav a.active { font-weight:bold; }
      .wrap { padding: 24px; max-width: 1100px; margin: 0 auto; }
      table { border-collapse: collapse; width:100%; }
      th, td { border: 1px solid #ddd; padding: 8px; }
      th { background: #fafafa; text-align: left; }
      .card { border:1px solid #eee; border-radius:10px; padding:16px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.03); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
